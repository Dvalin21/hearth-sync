[package]
name = "hearth-sync-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hearth-sync = { path = ".." }
serde_json = "1"

[[bin]]
name = "fuzz_json_parse"

[[bin]]
name = "fuzz_sync_push"
path = "fuzz_targets/fuzz_sync_push.rs"
test = false
doc = false
bench = false
path = "fuzz_targets/fuzz_json_parse.rs"
test = false
doc = false
bench = false
