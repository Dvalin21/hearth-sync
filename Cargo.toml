[package]
name = "hearth-sync"
version = "1.2.1"
edition = "2021"
rust-version = "1.80"
description = "Optional self-hosted sync server for HearthBoard (photos, search, ML)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/openlight/hearth-sync"

[features]
default = []
# Enable in-process ML (face detection, CLIP, OCR) via ONNX Runtime.
ml = ["dep:ort"]
# Enable direct TLS (otherwise terminate TLS at a reverse proxy).
tls = ["dep:rustls", "dep:tokio-rustls", "dep:hyper-util", "dep:rustls-pemfile", "dep:axum-server"]

[dependencies]
# Web
axum = { version = "0.7", features = ["multipart", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout", "compression-gzip"] }
tokio = { version = "1", features = ["full"] }
hyper = "1"
reqwest = { version = "0.12", features = ["json"] }

# DB
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Auth
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Images / media
image = "0.24"
gif = "0.12"
jpeg-decoder = "0.3"

# Hashing
sha2 = "0.10"
hex = "0.4"
encoding_rs = "=0.8.33"
time = "0.3"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }

# Config / errors / logging
clap = { version = "4", features = ["derive", "env"] }
config = "0.14"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

chrono = { version = "0.4", features = ["serde"] }
mime = "0.3"
mime_guess = "2"

# Optional
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
ort = { version = "2.0.0-rc.15", optional = true }
tokio-rustls = { version = "0.26", optional = true }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["multipart", "json"] }
http-body-util = "0.1"
tower = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
