services:
  hearth-sync:
    image: dvalin21/hearth-sync:latest
    container_name: hearth-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - hearth-sync-data:/data
    environment:
      HEARTH_SYNC_JWT_SECRET: ${HEARTH_SYNC_JWT_SECRET:?set in .env}
      HEARTH_SYNC_LOG: info

volumes:
  hearth-sync-data:
